services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: site-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=sqlite:////app/data/site.db
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    networks:
      - site-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: site-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - site-net

  nginx:
    image: nginx:1.27-alpine
    container_name: site-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - site-net

volumes:
  backend-data:

networks:
  site-net:
    driver: bridge
