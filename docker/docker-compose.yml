services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: site-backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      - DATABASE_URL=sqlite:////app/data/site.db
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - site-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: site-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - site-net

# volumes:
#   backend-data:

networks:
  site-net:
    driver: bridge
