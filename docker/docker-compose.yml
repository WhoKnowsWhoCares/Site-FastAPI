services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: site-backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      # SQLite file inside the container volume; host nginx proxies to 127.0.0.1:8000.
      # The DB is currently unused (all page content is static in the frontend) —
      # the backend only runs migrations against this file to stay migration-ready.
      # To restore PostgreSQL, comment DATABASE_URL back in and uncomment the db
      # service + backend depends_on below.
      - DATABASE_URL=sqlite:///./data/site.db
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - site-net

  # --- PostgreSQL (disabled: not used by any live feature) ---
  # db:
  #   image: postgres:17-alpine
  #   container_name: site-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-siteuser}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sitepass}
  #     - POSTGRES_DB=${POSTGRES_DB:-site}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-siteuser} -d $${POSTGRES_DB:-site}"]
  #     interval: 10s
  #     timeout: 5s
  #     start_period: 10s
  #     retries: 5
  #   networks:
  #     - site-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: site-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - site-net

volumes:
  backend-data:

networks:
  site-net:
    driver: bridge
